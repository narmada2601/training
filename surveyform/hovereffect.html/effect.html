<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    <script src=
"https://kit.fontawesome.com/457a315592.js" crossorigin="anonymous">
    </script>
        <title>social media hovereffect</title>

        <style>
             .container {
            background-color: rgb(213, 227, 63);
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .link {
            height: 70px;
            width: 70px;
            background-color: #a490e0;
            border-radius: 35px;
            text-align: center;
            margin: 7px;
            line-height: 80px;
        }

        a i {
            transition: 5px;;
        }
        h1{
            text-align: center;
        }

        .youtube:hover {
            color: red;
        }

        .facebook:hover {
              
            color: blue;
        }

        .instagram:hover {
            color: #e11d74;
        }

        .twitter:hover {
            color: #00adb5;
        }

        .github:hover {
            color: black;
        }

        .linkedin:hover {
            color: #c0bfe0;
        }
        </style>
    </head>
    <body>
        <p text-align="center">social media link icons (Hover over the icon)</p>

    <div class="container">
        <a class="link linkedin">
            <i class="fa fa-linkedin"></i>
        </a>
        <a class="link twitter">
            <i class="fa fa-twitter"></i>
        </a>
        <a class="link github">
            <i class="fa fa-3x fa-github"></i>
        </a>
        <a class="link instagram">
            <i class="fa  fa-instagram" area-hidden="true"></i>
        </a>
        <a class="link youtube">
            <i class="fa fa-youtube"></i>
        </a>
        <a class="link facebook">
            <i class="fa  fa-facebook-f"></i>
        </a>
    </div>
    </body>
</html>
