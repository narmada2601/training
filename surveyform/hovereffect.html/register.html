<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Registration Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: #edacac;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
             background-color: #ecf3f3; 
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            display:left;
        }
        .form-container h2 {
            margin-bottom: 20px;
        }
        .form-container label {
            display: block;
            margin-bottom: 5px;
        }
        .form-container input, .form-container select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
             border: 1px solid #ccc; 
            border-radius: 4px;
        }
        .form-container button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #218838;
        }
        body{
            background-image: url("Lamborghini1.jpg");
        }
        
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Car Registration</h2>
        <form>
            <label for="owner-name">RegOwner Name:</label>
            <input type="text" id="owner-name" name="owner-name" required placeholder="enter owner-name">
            
            <label for="car-model">Car Model</label>
            <input type="text" id="car-model" name="car-model" required >
            
            <label for="registration-number">Registration Number</label>
            <input type="text" id="registration-number" name="registration-number" required>
              
            <label for="registrartion-address">registrartion-address</label>
            <input type="address" id="registration-address" name="registrartion-address" required>
              

            
            <label for="year">Year</label>
            <input type="number" id="year" name="year" required>
            
            <label for="color">Color</label>
            <input type="text" id="color" name="color" required>
            
            <button type="submit">Get Data</button>
        </form>
    </div>
</body>
</html>
